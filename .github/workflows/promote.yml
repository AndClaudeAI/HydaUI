name: Approve build

# Rolls an approved preview out to phones by making it the repo's latest release. HydaUI
# checks that release every few hours: look-and-feel changes apply instantly, code changes
# install themselves.

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Build number to approve (the n in build-n)"
        required: true

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - name: Approve build-${{ inputs.build }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ inputs.build }}
        run: |
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$assets"
          for need in HydaUI.apk update.json hyda-config.json; do
            if ! grep -qx "$need" <<< "$assets"; then
              echo "::error::$TAG has no $need (was the signing-key secret set when it was built?)"
              exit 1
            fi
          done
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
            --prerelease=false --latest \
            --title "HydaUI build ${{ inputs.build }}"
          echo "::notice::build ${{ inputs.build }} is now live for phones"
